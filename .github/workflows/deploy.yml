name: Deploy

# main へ push されるたびに: テスト → ビルド → 配信 を全自動で行う
#   1. GitHub Pages   : PWA クライアント（追加設定なし）
#   2. GHCR           : サーバー入りコンテナイメージ ghcr.io/<owner>/pkfriend（追加設定なし）
#   3. Fly.io         : サーバー本体（Secrets に FLY_API_TOKEN を入れると有効）
#   4. Render         : Secrets に RENDER_DEPLOY_HOOK_URL を入れると Render 側の再デプロイも起動
on:
  push:
    branches: [main, 'claude/pokemon-blender-app-zfkrfp']  # main にマージするまでの間、開発ブランチからも公開する
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  NODE_VERSION: 22

jobs:
  # ---------------------------------------------------------------- 0. 共通: 設定値を決める
  setup:
    runs-on: ubuntu-latest
    outputs:
      fly_app: ${{ steps.vars.outputs.fly_app }}
      ws_url: ${{ steps.vars.outputs.ws_url }}
      base: ${{ steps.vars.outputs.base }}
      has_fly: ${{ steps.vars.outputs.has_fly }}
      has_render: ${{ steps.vars.outputs.has_render }}
    steps:
      - id: vars
        env:
          FLY_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          RENDER_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
          FLY_APP_OVERRIDE: ${{ vars.FLY_APP_NAME }}
          WS_URL_OVERRIDE: ${{ vars.PUBLIC_WS_URL }}
        run: |
          owner="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          repo="$(echo '${{ github.event.repository.name }}' | tr '[:upper:]' '[:lower:]')"
          app="${FLY_APP_OVERRIDE:-${repo}-${owner}}"
          ws="${WS_URL_OVERRIDE:-wss://${app}.fly.dev/ws}"
          case "${{ github.event.repository.name }}" in
            *.github.io) base="/" ;;
            *) base="/${{ github.event.repository.name }}/" ;;
          esac
          echo "fly_app=$app"   >> "$GITHUB_OUTPUT"
          echo "ws_url=$ws"     >> "$GITHUB_OUTPUT"
          echo "base=$base"     >> "$GITHUB_OUTPUT"
          echo "has_fly=$([ -n "$FLY_TOKEN" ] && echo true || echo false)"       >> "$GITHUB_OUTPUT"
          echo "has_render=$([ -n "$RENDER_HOOK" ] && echo true || echo false)"  >> "$GITHUB_OUTPUT"
          echo "::notice::Fly app=$app  ws=$ws  pages base=$base  fly=$([ -n "$FLY_TOKEN" ] && echo on || echo off)"

  # ---------------------------------------------------------------- 1. テスト & ビルド
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  # ---------------------------------------------------------------- 2. GitHub Pages (PWA クライアント)
  # 成果物を gh-pages ブランチに push する方式。公開リポジトリなら Pages が自動で有効になり
  # https://<owner>.github.io/<repo>/ で配信される（Settings で有効化する操作は不要）。
  pages:
    needs: [setup, test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --no-audit --no-fund
      # ---- 実況ボイスを VOICEVOX で事前生成（セリフ一覧が変わらない限りキャッシュを再利用）
      - name: Voice bank cache key
        id: vkey
        env:
          SPEAKER: ${{ vars.VOICE_SPEAKER || '11' }}
        run: |
          hash=$(npx tsx -e "import { allLines } from './shared/src/index.ts'; import { createHash } from 'node:crypto'; console.log(createHash('sha1').update(allLines().join('\n')).digest('hex').slice(0, 16))")
          echo "key=voice-v1-${SPEAKER}-${hash}" >> "$GITHUB_OUTPUT"
          echo "speaker=$SPEAKER" >> "$GITHUB_OUTPUT"
      - name: Restore voice bank
        id: vcache
        uses: actions/cache@v4
        with:
          path: client/public/voice
          key: ${{ steps.vkey.outputs.key }}
          restore-keys: voice-v2-${{ steps.vkey.outputs.speaker_name }}-${{ steps.vkey.outputs.speaker }}-
      - name: Start VOICEVOX engine
        if: steps.vcache.outputs.cache-hit != 'true' && vars.VOICE_DISABLED != 'true'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
          ffmpeg -version | head -1
          docker run -d --name voicevox -p 50021:50021 voicevox/voicevox_engine:cpu-ubuntu20.04-latest
          for i in $(seq 1 60); do curl -fsS http://127.0.0.1:50021/version && break; sleep 3; done
      - name: Synthesize commentary lines
        if: steps.vcache.outputs.cache-hit != 'true' && vars.VOICE_DISABLED != 'true'
        run: npx tsx scripts/build-voice.mts --engine http://127.0.0.1:50021 --speaker-name "${{ steps.vkey.outputs.speaker_name }}" --speaker ${{ steps.vkey.outputs.speaker }} --out client/public/voice --format mp3 --concurrency 3
      - name: Voice bank summary
        run: |
          if [ -f client/public/voice/manifest.json ]; then echo "::notice::voice bank: $(ls client/public/voice | wc -l) files, $(du -sh client/public/voice | cut -f1)"; else echo "::warning::no voice bank (falls back to the device's speech synthesis)"; fi
      - name: Build client for Pages
        env:
          VITE_BASE: ${{ needs.setup.outputs.base }}
          VITE_WS_URL: ${{ needs.setup.outputs.ws_url }}
          VITE_TTS_URL: ${{ vars.PUBLIC_TTS_URL }}
          VITE_TTS_SPEAKER: ${{ vars.PUBLIC_TTS_SPEAKER }}
        run: |
          npm run build -w client
          cp client/dist/index.html client/dist/404.html   # SPA fallback
      - name: Publish to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: client/dist
          force_orphan: true
          commit_message: "deploy: ${{ github.sha }}"
      - name: Wait for the site
        run: |
          owner="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          url="https://${owner}.github.io${{ needs.setup.outputs.base }}"
          for i in $(seq 1 9); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$url")
            if [ "$code" = "200" ]; then echo "::notice::PWA is live at $url"; exit 0; fi
            sleep 20
          done
          echo "::warning::$url is not reachable yet. First time only: Settings -> Pages -> Source: Deploy from a branch -> gh-pages / (root). After that every push updates the site automatically."

  # ---------------------------------------------------------------- 3. コンテナイメージ (GHCR)
  image:
    needs: [test]
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        run: |
          image="ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          tag="$(echo '${{ github.ref_name }}' | tr '/' '-')"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.image }}:sha-${{ github.sha }}
            ${{ github.ref_name == 'main' && format('{0}:latest', steps.meta.outputs.image) || '' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---------------------------------------------------------------- 4. Fly.io (サーバー本体 + クライアント)
  fly:
    needs: [setup, test]
    if: needs.setup.outputs.has_fly == 'true'
    runs-on: ubuntu-latest
    environment:
      name: fly
      url: https://${{ needs.setup.outputs.fly_app }}.fly.dev
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      FLY_APP: ${{ needs.setup.outputs.fly_app }}
      FLY_ORG: ${{ vars.FLY_ORG || 'personal' }}
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Create app if it does not exist
        run: |
          if ! flyctl status --app "$FLY_APP" >/dev/null 2>&1; then
            flyctl apps create "$FLY_APP" --org "$FLY_ORG"
          fi
      - name: Deploy
        run: flyctl deploy --remote-only --app "$FLY_APP" --ha=false
      - name: Smoke test
        run: |
          for i in 1 2 3 4 5 6; do
            if curl -fsS "https://$FLY_APP.fly.dev/api/health"; then echo; echo "::notice::https://$FLY_APP.fly.dev is live"; exit 0; fi
            sleep 10
          done
          echo "health check failed"; exit 1

  # ---------------------------------------------------------------- 5. Render (任意)
  render:
    needs: [setup, test]
    if: needs.setup.outputs.has_render == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deploy hook
        run: curl -fsS -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
