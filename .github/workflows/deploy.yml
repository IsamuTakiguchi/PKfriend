name: Deploy

# main へ push されるたびに: テスト → ビルド → 配信 を全自動で行う
#   1. GitHub Pages   : PWA クライアント（追加設定なし）
#   2. GHCR           : サーバー入りコンテナイメージ ghcr.io/<owner>/pkfriend（追加設定なし）
#   3. Fly.io         : サーバー本体（Secrets に FLY_API_TOKEN を入れると有効）
#   4. Render         : Secrets に RENDER_DEPLOY_HOOK_URL を入れると Render 側の再デプロイも起動
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write
  packages: write

env:
  NODE_VERSION: 22

jobs:
  # ---------------------------------------------------------------- 0. 共通: 設定値を決める
  setup:
    runs-on: ubuntu-latest
    outputs:
      fly_app: ${{ steps.vars.outputs.fly_app }}
      ws_url: ${{ steps.vars.outputs.ws_url }}
      base: ${{ steps.vars.outputs.base }}
      has_fly: ${{ steps.vars.outputs.has_fly }}
      has_render: ${{ steps.vars.outputs.has_render }}
    steps:
      - id: vars
        env:
          FLY_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          RENDER_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
          FLY_APP_OVERRIDE: ${{ vars.FLY_APP_NAME }}
          WS_URL_OVERRIDE: ${{ vars.PUBLIC_WS_URL }}
        run: |
          owner="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          repo="$(echo '${{ github.event.repository.name }}' | tr '[:upper:]' '[:lower:]')"
          app="${FLY_APP_OVERRIDE:-${repo}-${owner}}"
          ws="${WS_URL_OVERRIDE:-wss://${app}.fly.dev/ws}"
          case "${{ github.event.repository.name }}" in
            *.github.io) base="/" ;;
            *) base="/${{ github.event.repository.name }}/" ;;
          esac
          echo "fly_app=$app"   >> "$GITHUB_OUTPUT"
          echo "ws_url=$ws"     >> "$GITHUB_OUTPUT"
          echo "base=$base"     >> "$GITHUB_OUTPUT"
          echo "has_fly=$([ -n "$FLY_TOKEN" ] && echo true || echo false)"       >> "$GITHUB_OUTPUT"
          echo "has_render=$([ -n "$RENDER_HOOK" ] && echo true || echo false)"  >> "$GITHUB_OUTPUT"
          echo "::notice::Fly app=$app  ws=$ws  pages base=$base  fly=$([ -n "$FLY_TOKEN" ] && echo on || echo off)"

  # ---------------------------------------------------------------- 1. テスト & ビルド
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  # ---------------------------------------------------------------- 2. GitHub Pages (PWA クライアント)
  pages:
    needs: [setup, test]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Build client for Pages
        env:
          VITE_BASE: ${{ needs.setup.outputs.base }}
          VITE_WS_URL: ${{ needs.setup.outputs.ws_url }}
        run: |
          npm run build -w client
          cp client/dist/index.html client/dist/404.html   # SPA fallback
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: client/dist
      - id: deployment
        uses: actions/deploy-pages@v4

  # ---------------------------------------------------------------- 3. コンテナイメージ (GHCR)
  image:
    needs: [test]
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        run: |
          image="ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          tag="$(echo '${{ github.ref_name }}' | tr '/' '-')"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.image }}:sha-${{ github.sha }}
            ${{ github.ref_name == 'main' && format('{0}:latest', steps.meta.outputs.image) || '' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---------------------------------------------------------------- 4. Fly.io (サーバー本体 + クライアント)
  fly:
    needs: [setup, test]
    if: needs.setup.outputs.has_fly == 'true'
    runs-on: ubuntu-latest
    environment:
      name: fly
      url: https://${{ needs.setup.outputs.fly_app }}.fly.dev
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      FLY_APP: ${{ needs.setup.outputs.fly_app }}
      FLY_ORG: ${{ vars.FLY_ORG || 'personal' }}
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Create app if it does not exist
        run: |
          if ! flyctl status --app "$FLY_APP" >/dev/null 2>&1; then
            flyctl apps create "$FLY_APP" --org "$FLY_ORG"
          fi
      - name: Deploy
        run: flyctl deploy --remote-only --app "$FLY_APP" --ha=false
      - name: Smoke test
        run: |
          for i in 1 2 3 4 5 6; do
            if curl -fsS "https://$FLY_APP.fly.dev/api/health"; then echo; echo "::notice::https://$FLY_APP.fly.dev is live"; exit 0; fi
            sleep 10
          done
          echo "health check failed"; exit 1

  # ---------------------------------------------------------------- 5. Render (任意)
  render:
    needs: [setup, test]
    if: needs.setup.outputs.has_render == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deploy hook
        run: curl -fsS -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
